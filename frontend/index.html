<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surfcasting Analytics – Auto Orientation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: { 900: '#0b132b', 800: '#1a2a4a', 700: '#2a3a5a' },
            neon: '#00e5ff',
            amber: '#f59e0b',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #0b132b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { height: 400px; width: 100%; border-radius: 1rem; border: 2px solid #1e3a5f; }
    .leaflet-container { background-color: #0b132b; }
    .card { background-color: #1a2a4a; border: 1px solid #2a3a5a; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px rgba(0,229,255,0.1); }
    .btn-primary { background-color: #00e5ff; color: #0b132b; font-weight: bold; padding: 0.75rem 2rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: all 0.3s; }
    .btn-primary:hover { background-color: #00b8d4; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background-color: transparent; color: #00e5ff; border: 1px solid #00e5ff; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.3s; }
    .btn-secondary:hover { background-color: rgba(0,229,255,0.1); }
    .input-field { background-color: #0f1a2e; border: 1px solid #2a3a5a; color: #e0e7ff; border-radius: 0.5rem; padding: 0.75rem; width: 100%; }
    .input-field:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,0.3); }
    .segmented-btn { background-color: #0f1a2e; border: 1px solid #2a3a5a; color: #a0b3d9; padding: 0.5rem 1rem; cursor: pointer; transition: all 0.2s; flex: 1; }
    .segmented-btn.active { background-color: #00e5ff; color: #0b132b; font-weight: bold; border-color: #00e5ff; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,19,43,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .spinner { width: 60px; height: 60px; border: 6px solid rgba(0,229,255,0.2); border-top: 6px solid #00e5ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .direction-display { background-color: #0f1a2e; border: 1px solid #2a3a5a; color: #00e5ff; padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-weight: bold; text-align: center; min-width: 130px; }
    .reason-text { max-width: 200px; white-space: normal; word-break: break-word; font-size: 0.8rem; color: #a0b3d9; }
  </style>
</head>
<body class="text-gray-200 p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl md:text-4xl font-bold text-neon mb-6 text-center">🎣 Surfcasting Analytics – Auto Orientation</h1>

    <div class="flex justify-center gap-4 mb-8">
      <button id="tabSingle" class="btn-primary rounded-lg">📍 تقرير بقعة</button>
      <button id="tabScan" class="btn-secondary rounded-lg">🔍 مسح الشواطئ</button>
    </div>

    <!-- لوحة التقرير الفردي -->
    <div id="panelSingle">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        <div class="lg:col-span-2"><div id="map"></div></div>
        <div class="card space-y-5">
          <h2 class="text-xl font-bold text-neon mb-4">⚙️ إعدادات الموقع</h2>
          <div><label class="block text-sm text-gray-400 mb-1">خط العرض</label><input type="number" id="latitude" step="any" class="input-field" value="36.7000"></div>
          <div><label class="block text-sm text-gray-400 mb-1">خط الطول</label><input type="number" id="longitude" step="any" class="input-field" value="10.8000"></div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">اتجاه الشاطئ نحو البحر</label>
            <div class="flex items-center gap-3 mb-2">
              <input type="range" id="orientation" min="0" max="360" value="0" class="w-full accent-neon">
              <span id="orientationValue" class="direction-display">0° (شمال)</span>
            </div>
            <button id="autoOrientBtn" class="btn-secondary w-full text-sm">📍 تحديد الاتجاه تلقائياً</button>
            <p id="orientSource" class="text-xs text-gray-500 mt-1"></p>
          </div>
          <div><label class="block text-sm text-gray-400 mb-1">نوع الشاطئ</label><select id="beachType" class="input-field"><option value="sandy">رملي</option><option value="rocky">صخري</option></select></div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">التاريخ المستهدف</label>
            <div class="flex rounded-md overflow-hidden border border-[#2a3a5a]">
              <button class="segmented-btn active" data-date="today">اليوم</button>
              <button class="segmented-btn" data-date="tomorrow">غداً</button>
              <button class="segmented-btn" data-date="day_after">بعد غد</button>
            </div>
            <input type="hidden" id="targetDate" value="today">
          </div>
          <button id="submitBtn" class="btn-primary w-full mt-4">📊 توليد التقرير البحري</button>
          <p class="text-xs text-gray-500 text-center mt-2">يتم جلب البيانات مباشرة من Open-Meteo عبر متصفحك</p>
        </div>
      </div>
      <div id="reportCard" class="card hidden">
        <div id="reportContent" class="text-gray-300 whitespace-pre-line leading-loose text-base"></div>
        <div class="flex gap-2 mt-4">
          <button onclick="copyReport()" class="btn-secondary text-sm">📋 نسخ التقرير</button>
          <button onclick="shareWhatsApp()" class="btn-secondary text-sm">💬 مشاركة واتساب</button>
        </div>
      </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-neon text-lg font-semibold">جاري جلب البيانات وتحليلها...</p>
        <p class="text-gray-400 text-sm mt-2">يتم الاتصال بـ Open-Meteo من جهازك ثم إرسالها للخادم للتحليل</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = 'https://spotdata.onrender.com';
    const MARINE_API = 'https://marine-api.open-meteo.com/v1/marine';
    const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

    const tabSingle = document.getElementById('tabSingle');
    const tabScan = document.getElementById('tabScan');
    const panelSingle = document.getElementById('panelSingle');
    const panelScan = document.getElementById('panelScan');

    tabSingle.addEventListener('click', ()=>{
      tabSingle.className='btn-primary rounded-lg'; tabScan.className='btn-secondary rounded-lg';
      panelSingle.classList.remove('hidden'); panelScan.classList.add('hidden');
    });
    tabScan.addEventListener('click', ()=>{
      tabScan.className='btn-primary rounded-lg'; tabSingle.className='btn-secondary rounded-lg';
      panelScan.classList.remove('hidden'); panelSingle.classList.add('hidden');
    });

    const map = L.map('map').setView([36.7,10.8], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OSM &copy; CARTO', subdomains:'abcd', maxZoom:19
    }).addTo(map);
    const marker = L.marker([36.7,10.8],{draggable:true}).addTo(map).bindPopup('اسحب العلامة').openPopup();
    marker.on('dragend', ()=>{
      const p=marker.getLatLng();
      document.getElementById('latitude').value=p.lat.toFixed(6);
      document.getElementById('longitude').value=p.lng.toFixed(6);
      updateBottomType();
    });
    function updateMarker(){
      const lat=parseFloat(document.getElementById('latitude').value)||36.7;
      const lng=parseFloat(document.getElementById('longitude').value)||10.8;
      marker.setLatLng([lat,lng]); map.setView([lat,lng],10);
    }
    document.getElementById('latitude').addEventListener('change', updateMarker);
    document.getElementById('longitude').addEventListener('change', updateMarker);
    document.getElementById('latitude').addEventListener('change', updateBottomType);
    document.getElementById('longitude').addEventListener('change', updateBottomType);

    async function updateBottomType() {
      const lat = parseFloat(document.getElementById('latitude').value);
      const lng = parseFloat(document.getElementById('longitude').value);
      if (isNaN(lat) || isNaN(lng)) return;
      try {
        const resp = await fetch(`${API_BASE}/detect-bottom-type`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude: lat, longitude: lng })
        });
        if (!resp.ok) return;
        const data = await resp.json();
        document.getElementById('beachType').value = data.bottom_type === 'rocky' ? 'rocky' : 'sandy';
      } catch (e) {}
    }

    const dirs = ['شمال','شمال شمال شرقي','شمال شرقي','شرق شمال شرقي','شرق','شرق جنوب شرقي','جنوب شرقي','جنوب جنوب شرقي','جنوب','جنوب جنوب غربي','جنوب غربي','غرب جنوب غربي','غرب','غرب شمال غربي','شمال غربي','شمال شمال غربي'];
    function degToDir(d){return dirs[Math.round(d/22.5)%16];}
    const orientSlider=document.getElementById('orientation');
    const orientVal=document.getElementById('orientationValue');
    const orientSource=document.getElementById('orientSource');
    orientSlider.addEventListener('input',()=>{
      const deg=parseInt(orientSlider.value);
      orientVal.textContent=`${deg}° (${degToDir(deg)})`;
    });

    document.getElementById('autoOrientBtn').addEventListener('click',async ()=>{
      const lat=parseFloat(document.getElementById('latitude').value);
      const lng=parseFloat(document.getElementById('longitude').value);
      if(isNaN(lat)||isNaN(lng))return alert('إحداثيات غير صحيحة');
      const btn=document.getElementById('autoOrientBtn');
      btn.disabled=true; btn.textContent='⏳ تحديد...';
      try{
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        const r=await fetch(`${API_BASE}/auto-orientation`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({latitude:lat,longitude:lng}),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if(!r.ok)throw new Error('فشل');
        const d=await r.json();
        if (d.orientation === -1) {
          alert(d.message || 'تعذر التحديد التلقائي، أدخل الاتجاه يدوياً.');
          orientSource.textContent = 'تعذر التحديد';
        } else {
          orientSlider.value = d.orientation;
          orientVal.textContent=`${d.orientation}° (${degToDir(d.orientation)})`;
          orientSource.textContent = `تم التحديد من: ${d.source === 'overpass' ? 'الخريطة' : 'أقرب شاطئ'}`;
        }
      }catch(e){
        alert('تعذر التحديد التلقائي.');
        orientSource.textContent = 'تعذر';
      }
      finally{btn.disabled=false;btn.textContent='📍 تحديد تلقائي';}
    });

    document.querySelectorAll('.segmented-btn').forEach(b=>{
      b.addEventListener('click',function(){
        document.querySelectorAll('.segmented-btn').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('targetDate').value=this.dataset.date;
      });
    });

    async function fetchMarineData(lat, lng, start, end) {
      const url = `${MARINE_API}?latitude=${lat}&longitude=${lng}&hourly=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,sea_surface_temperature&timezone=auto&start_date=${start}&end_date=${end}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Marine API: ${resp.status}`);
      return resp.json();
    }

    async function fetchWeatherData(lat, lng, start, end) {
      const url = `${WEATHER_API}?latitude=${lat}&longitude=${lng}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,temperature_2m,precipitation,weather_code&daily=sunrise,sunset&timezone=auto&start_date=${start}&end_date=${end}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Weather API: ${resp.status}`);
      return resp.json();
    }

    function getDateRange(targetDateText) {
      const today = new Date();
      const tzOffset = today.getTimezoneOffset();
      const todayLocal = new Date(today.getTime() - tzOffset * 60000);
      const target = new Date(todayLocal);
      if (targetDateText === 'tomorrow') target.setDate(target.getDate() + 1);
      else if (targetDateText === 'day_after') target.setDate(target.getDate() + 2);
      const start = new Date(target);
      start.setDate(start.getDate() - 2);
      const end = new Date(target);
      end.setDate(end.getDate() + 1);
      const format = d => d.toISOString().split('T')[0];
      return { start: format(start), end: format(end) };
    }

    const submitBtn=document.getElementById('submitBtn');
    const loadingOverlay=document.getElementById('loadingOverlay');
    const reportCard=document.getElementById('reportCard');
    const reportContent=document.getElementById('reportContent');

    submitBtn.addEventListener('click',async ()=>{
      const lat = parseFloat(document.getElementById('latitude').value);
      const lng = parseFloat(document.getElementById('longitude').value);
      const orient = parseInt(document.getElementById('orientation').value);
      const beachType = document.getElementById('beachType').value;
      const targetDate = document.getElementById('targetDate').value;
      if (isNaN(lat) || isNaN(lng) || isNaN(orient)) {
        alert('تأكد من إدخال الإحداثيات والاتجاه بشكل صحيح.');
        return;
      }
      loadingOverlay.classList.remove('hidden');
      reportCard.classList.add('hidden');
      submitBtn.disabled = true;

      try {
        const { start, end } = getDateRange(targetDate);
        const [marineData, weatherData] = await Promise.all([
          fetchMarineData(lat, lng, start, end),
          fetchWeatherData(lat, lng, start, end)
        ]);

        const payload = {
          beach_orientation: orient,
          beach_type: beachType,
          target_date: targetDate,
          marine_data: marineData,
          weather_data: weatherData
        };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 90000);
        const resp = await fetch(`${API_BASE}/generate-report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || `خطأ ${resp.status}`);
        }
        const data = await resp.json();
        reportContent.textContent = data.report || 'لم يصدر تقرير';
        reportCard.classList.remove('hidden');
        reportCard.scrollIntoView({behavior:'smooth'});
      } catch (e) {
        if (e.name === 'AbortError') {
          alert('❌ انتهت مهلة الانتظار (90 ثانية). حاول مجدداً.');
        } else {
          alert('❌ فشل جلب التقرير:\n' + e.message);
        }
      } finally {
        loadingOverlay.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });

    function copyReport() {
      const text = document.getElementById('reportContent').textContent;
      navigator.clipboard.writeText(text).then(() => alert('تم نسخ التقرير!'));
    }
    function shareWhatsApp() {
      const text = encodeURIComponent(document.getElementById('reportContent').textContent);
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
