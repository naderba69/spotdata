<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surfcasting Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background: #0b132b; color: #e0e7ff; font-family: sans-serif; }
    #map { height: 400px; border-radius: 1rem; }
    .card { background: #1a2a4a; border-radius: 1rem; padding: 1.5rem; }
    .btn-primary { background: #00e5ff; color: #0b132b; padding: 0.75rem 2rem; border-radius: 0.5rem; border: none; cursor: pointer; }
    .input-field { background: #0f1a2e; border: 1px solid #2a3a5a; color: #e0e7ff; padding: 0.75rem; border-radius: 0.5rem; width: 100%; }
    .segmented-btn { background: #0f1a2e; border: 1px solid #2a3a5a; color: #a0b3d9; padding: 0.5rem 1rem; cursor: pointer; }
    .segmented-btn.active { background: #00e5ff; color: #0b132b; }
    .spinner { width: 60px; height: 60px; border: 6px solid rgba(0,229,255,0.2); border-top: 6px solid #00e5ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="p-4">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-[#00e5ff] mb-8 text-center">🎣 Surfcasting Analytics</h1>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2"><div id="map"></div></div>
      <div class="card space-y-4">
        <h2 class="text-xl font-bold text-[#00e5ff]">⚙️ الإعدادات</h2>
        <input type="number" id="latitude" step="any" class="input-field" value="36.7000" placeholder="خط العرض">
        <input type="number" id="longitude" step="any" class="input-field" value="10.8000" placeholder="خط الطول">
        <div class="flex items-center gap-3">
          <input type="range" id="orientation" min="0" max="360" value="45" class="w-full">
          <span id="orientationValue" class="text-[#00e5ff] font-bold">45°</span>
        </div>
        <button id="autoOrientBtn" class="border border-[#00e5ff] text-[#00e5ff] py-2 px-4 rounded">📍 تحديد تلقائي</button>
        <select id="beachType" class="input-field"><option value="sandy">رملي</option><option value="rocky">صخري</option></select>
        <div class="flex rounded-md overflow-hidden">
          <button class="segmented-btn active" data-date="today">اليوم</button>
          <button class="segmented-btn" data-date="tomorrow">غداً</button>
          <button class="segmented-btn" data-date="day_after">بعد غد</button>
        </div>
        <input type="hidden" id="targetDate" value="today">
        <button id="submitBtn" class="btn-primary w-full mt-4">📊 توليد التقرير</button>
        <p class="text-xs text-gray-500 text-center mt-2">قد يستغرق 30-50 ثانية في البداية</p>
      </div>
    </div>
    <div id="reportCard" class="card hidden">
      <div id="reportContent" class="whitespace-pre-wrap leading-loose"></div>
    </div>
    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([36.7, 10.8], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OSM &copy; CARTO', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
    const marker = L.marker([36.7, 10.8], { draggable: true }).addTo(map).bindPopup('اسحب العلامة').openPopup();
    marker.on('dragend', () => {
      const pos = marker.getLatLng();
      document.getElementById('latitude').value = pos.lat.toFixed(6);
      document.getElementById('longitude').value = pos.lng.toFixed(6);
    });
    function updateMarker() {
      const lat = parseFloat(document.getElementById('latitude').value) || 36.7;
      const lng = parseFloat(document.getElementById('longitude').value) || 10.8;
      marker.setLatLng([lat, lng]); map.setView([lat, lng], 10);
    }
    document.getElementById('latitude').addEventListener('change', updateMarker);
    document.getElementById('longitude').addEventListener('change', updateMarker);

    const dirs = ['شمال','شمال شمال شرقي','شمال شرقي','شرق شمال شرقي','شرق','شرق جنوب شرقي','جنوب شرقي','جنوب جنوب شرقي','جنوب','جنوب جنوب غربي','جنوب غربي','غرب جنوب غربي','غرب','غرب شمال غربي','شمال غربي','شمال شمال غربي'];
    function degToDir(d) { return dirs[Math.round(d / 22.5) % 16]; }
    const orientSlider = document.getElementById('orientation');
    const orientVal = document.getElementById('orientationValue');
    orientSlider.addEventListener('input', () => {
      const deg = parseInt(orientSlider.value);
      orientVal.textContent = `${deg}° (${degToDir(deg)})`;
    });

    document.getElementById('autoOrientBtn').addEventListener('click', async () => {
      const lat = parseFloat(document.getElementById('latitude').value);
      const lng = parseFloat(document.getElementById('longitude').value);
      if (isNaN(lat) || isNaN(lng)) return alert('إحداثيات غير صحيحة');
      const btn = document.getElementById('autoOrientBtn');
      btn.disabled = true; btn.textContent = '⏳ تحديد...';
      try {
        const resp = await fetch('https://spotdata.onrender.com/auto-orientation', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude: lat, longitude: lng })
        });
        if (!resp.ok) throw new Error('فشل');
        const data = await resp.json();
        orientSlider.value = data.orientation;
        orientVal.textContent = `${data.orientation}° (${degToDir(data.orientation)})`;
      } catch(e) { alert('تعذر التحديد التلقائي'); }
      finally { btn.disabled = false; btn.textContent = '📍 تحديد تلقائي'; }
    });

    document.querySelectorAll('.segmented-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('targetDate').value = this.dataset.date;
      });
    });

    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const reportCard = document.getElementById('reportCard');
    const reportContent = document.getElementById('reportContent');
    const API_URL = 'https://spotdata.onrender.com/generate-report';

    submitBtn.addEventListener('click', async () => {
      const payload = {
        latitude: parseFloat(document.getElementById('latitude').value),
        longitude: parseFloat(document.getElementById('longitude').value),
        beach_orientation: parseInt(document.getElementById('orientation').value),
        beach_type: document.getElementById('beachType').value,
        target_date: document.getElementById('targetDate').value
      };
      loadingOverlay.classList.remove('hidden');
      reportCard.classList.add('hidden');
      try {
        const response = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          let err = `خطأ ${response.status}`;
          try { const d = await response.json(); err += ': ' + d.detail; } catch(_) {}
          throw new Error(err);
        }
        const data = await response.json();
        reportContent.textContent = data.report || 'لم يصدر تقرير';
        reportCard.classList.remove('hidden');
        reportCard.scrollIntoView({ behavior: 'smooth' });
      } catch(e) { alert('❌ فشل: ' + e.message); }
      finally { loadingOverlay.classList.add('hidden'); }
    });
  </script>
</body>
</html>
